Com o peito em chamas
E os olhos d’água.
Sou uma rosa amassada,
Com a morte na alma
E o sorriso de canto,
Disfarçando as lágrimas.
Sou uma rosa sem pétalas,
Numa prisão perpétua,
Esperando o meu fim.
Sou uma rosa
Com espinhos atravessados
E o coração maltratado,
Esperando a jaula abrir.`},{num:"2.",title:"Insônia",text:`A noite desperta o medo,
Minha cama já reconhece
Meu olhar de desespero,
Pela lágrima que aparece.
O travesseiro tem receio,
Minha mente entristece,
Com o remoer deste peso que só adoece.`},{num:"3.",title:"Sou um ser humano quebrado",text:`Sou um ser humano quebrado.
Um pouco louco
E, de certa forma, amaldiçoado.
Surjo à noite,
Como aurora boreal,
Pelo sensível toque
De uma crise existencial.
Que se alimenta
Da minha energia,
Adoecendo o corpo
E toda alegria.
Afogando minha liberdade,
Meus sonhos e a beleza
Que em mim resistia.
E hoje, sofro calado, esperando ser reconhecido pelos meus olhos cansados.
Na cura dessa amargura que me mantém atordoado.`},{num:"4.",title:"Território infernal",text:`Ambiente claustrofóbico,
venenoso e letal.
Prisioneiros sem corpos,
num dia é fatal.
Presságio apocalíptico,
grotesco e banal.
Tragam-me a faca
sanguínea e brutal.
Cansaço contamina eu e geral.
Somos todos pesticida,
território infernal.`},{num:"5.",title:"Câncer",text:`Existe um câncer que ninguém vê que entra nas entranhas e colapsa o ser.
Primeiro adoece a noite, segundo adoece o dia, depois tudo se contamina.
No raio X não dá pra ver, ele é transparente dentro do ser.
Primeiro vem de mansinho, segundo finge que é amigo, depois te joga no vazio.
E como se curar dessa parte doente? Com garras de metal rasgando a carne sob sol quente.`}]},{id:"morte",title:"CICLO II — A MORTE",intro:"A morte, mais do que um fim, é um espaço de reflexão.",poems:[{num:"6.",title:"Epitáfio II",text:`Este é o fim da linha,
da rua, da reta, da curva.
Este é o fim de tudo,
do mundo, universo e inverso.
Se para existir tenho que conquistar,
se para vencer tenho que lutar,
quero uma lápide para me autosepultar.
Este é o meu eu doente,
cansado, seco e demente.
Se para ver o sol tenho que levantar,
se para respirar tenho que funcionar,
quero esperança para me aterrar.
Este é meu eu tentando se curar.`},{num:"7.",title:"Velório",text:`Qual é o gosto? Aquele que não se sabe, Que surge no final De um dia qualquer Onde a surpresa acontece E lágrimas perdidas aparecem.
O que precedeu? Foi o fim de um amor? Ou a cabeça fraca? Não se sabe, não se tem. O gosto da morte é desconhecido, E suas perguntas Não cruzam o além.`},{num:"8.",title:"Último dia",text:`Não quero ter medo em meu último dia! Quero respirar fundo e partir com alegria, Pois nada melhor do que viver a vida.
Música para alegrar a morte E iluminar a partida. Dança para acalmar os mortos E abrir os caminhos tortuosos.`},{num:"9.",title:"Tulipas",text:`Tulipas roxas sob meu corpo, Um corpo decomposto, De luz e sombra, De alma e sonho.
Tulipas vermelhas sob meu sangue, Um sangue da cor vibrante, Que já não habita aqui Igual as tulipas do meu jardim.`}]},{id:"sol",title:"CICLO III — O SOL",intro:"Depois da queda, há sempre uma fresta de luz. Essa última parte do e-book fala sobre a reconstrução — o momento em que, mesmo feridos, encontramos um jeito de continuar, de nascer de novo dentro de nós mesmos.",poems:[{num:"10.",title:"I",text:`Sou feita de sol, Assim como o céu.
Sou feita de chuva, Assim como o céu.
Sou feita de azul, Assim como o céu.
Sou feita de tempestade, Assim como o céu.
Assim como o céu, sou.`},{num:"11.",title:"II",text:`Semeio sonhos santos Sob o silêncio singular, Sentindo a sonoridade solene, sensível e sem submissão.
Semeio sonhos santos Santificados de sol suspiro, e sanidade.
Sim, somos simplesmente seres sobreviventes. Sim, somos simplesmente seres sentimentais.`},{num:"12.",title:"O quadrado de Sophia",text:`O quadrado de Sophia amanhece no meu dia, contrastando as cores, tensionando as dores antes do meio-dia.
O quadrado de Sophia sombreia os espaços e me envolve num abraço, numa ânsia de vida.
